<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="brand">
      <mat-icon class="brand-icon">hub</mat-icon>
      <span class="brand-text">Platform</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/services" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dns</mat-icon>
        <span matListItemTitle>Services</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <span class="version-tag">MVP UI preview</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      <span class="toolbar-title">Platform Dashboard</span>
      <span class="spacer"></span>
      <span class="api-key-chip" matTooltip="Active tenant API key (masked)">
        <mat-icon>vpn_key</mat-icon>
        {{ session.maskedApiKey() }}
      </span>
      <button mat-icon-button (click)="signOut()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="shell-body">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
