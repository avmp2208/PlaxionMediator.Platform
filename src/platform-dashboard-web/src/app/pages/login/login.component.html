<div class="login-page">
  <mat-card class="login-card">
    <div class="login-brand">
      <mat-icon class="brand-icon">hub</mat-icon>
      <div>
        <h1>Platform Dashboard</h1>
        <p class="subtitle">PlaxionMediator.Platform</p>
      </div>
    </div>

    <p class="login-copy">
      Enter your tenant API key to view retained service metrics.
      Your key is kept only in this browser tab and is never persisted beyond your session.
    </p>

    <form class="login-form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tenant API key</mat-label>
        <input
          matInput
          name="apiKey"
          [type]="hideKey ? 'password' : 'text'"
          [(ngModel)]="apiKey"
          placeholder="pk_..."
          autocomplete="off"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideKey = !hideKey"
          [attr.aria-label]="'Toggle key visibility'"
        >
          <mat-icon>{{ hideKey ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error) {
        <p class="error-text">{{ error }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loading">
        @if (loading) {
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        } @else {
          Connect
        }
      </button>
    </form>
  </mat-card>
</div>
