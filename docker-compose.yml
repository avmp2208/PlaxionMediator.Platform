services:
  postgres:
    image: postgres:16-alpine
    container_name: plaxion-db
    environment:
      POSTGRES_DB: plaxion
      POSTGRES_USER: plaxion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plaxion_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plaxion -d plaxion"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  platform-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plaxion-migrate
    environment:
      ROLE: api
      Storage__Provider: PostgreSql
      ConnectionStrings__Platform: Host=postgres;Database=plaxion;Username=plaxion;Password=${POSTGRES_PASSWORD:-plaxion_secret}
      ASPNETCORE_ENVIRONMENT: Production
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  platform-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plaxion-api
    environment:
      ROLE: api
      Storage__Provider: PostgreSql
      ConnectionStrings__Platform: Host=postgres;Database=plaxion;Username=plaxion;Password=${POSTGRES_PASSWORD:-plaxion_secret}
      API_BASE_URL: "" # Leave empty for same-origin
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${PLATFORM_API_PORT:-8082}:8080"
    depends_on:
      platform-migrate:
        condition: service_completed_successfully

  platform-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plaxion-ingestion
    environment:
      ROLE: ingestion
      Storage__Provider: PostgreSql
      ConnectionStrings__Platform: Host=postgres;Database=plaxion;Username=plaxion;Password=${POSTGRES_PASSWORD:-plaxion_secret}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8081:8080"
    depends_on:
      platform-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
