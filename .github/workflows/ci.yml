name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plaxion
          POSTGRES_USER: plaxion
          POSTGRES_PASSWORD: plaxion_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plaxion -d plaxion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
        env:
          ConnectionStrings__Platform: "Host=localhost;Port=5432;Database=plaxion;Username=plaxion;Password=plaxion_secret"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/platform-dashboard-web/package-lock.json

      - name: Angular dependencies
        run: npm ci
        working-directory: src/platform-dashboard-web

      - name: Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: src/platform-dashboard-web

      - name: Angular build
        run: npm run build -- --configuration=production
        working-directory: src/platform-dashboard-web

      - name: Docker build validation
        run: docker build . -t plaxion-platform:test
